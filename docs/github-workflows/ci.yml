name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!LICENSE'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!LICENSE'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libx11-dev libxdo-dev

      - name: Set up Rust checks
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            src-tauri/target
            engines/cleanup/target
          key: ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}

      - name: Check the interface
        run: |
          npm ci
          npm run check
          npm run lint
          npm test
          npm run build

      - name: Check formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path engines/cleanup/Cargo.toml --all -- --check

      - name: Build the cleanup engine
        run: npm run prepare:engine -- x86_64-unknown-linux-gnu

      - name: Check and test the native code
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path engines/cleanup/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path engines/cleanup/Cargo.toml --locked

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file engines/cleanup/Cargo.lock
