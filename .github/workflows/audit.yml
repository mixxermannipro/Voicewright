# Wöchentliches Sicherheits-Audit, bewusst außerhalb des PR-Gates.
# Warnungen (z. B. "unmaintained") dürfen grüne Läufe nicht stoppen,
# echte Sicherheitslücken dagegen schon: cargo-audit und npm audit
# enden nicht-null, sobald eine Lücke gefunden wird.
name: Security audit

on:
  schedule:
    # Sonntag 04:17 UTC, außerhalb des Wochenend-Aufwinds
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      # liest package-lock.json direkt, kein npm ci nötig
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version

      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the dependency lock files
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file engines/cleanup/Cargo.lock
