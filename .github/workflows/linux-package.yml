name: Linux packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install build and package validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libx11-dev libxdo-dev libxkbcommon-dev patchelf \
            desktop-file-utils appstream
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engines/cleanup/target
            src-tauri/target
          key: linux-jammy-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '.cargo/config.toml', '.github/workflows/linux-package.yml') }}
      - name: Build and validate release packages (no publication)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          npm ci
          npm test -- scripts/linux-packaging.test.mjs
          python3 -m unittest discover -s scripts -p 'test_linux_bundle.py'
          npm run prepare:engine
          npm run tauri -- build --ci --bundles appimage,deb -- --locked
          mkdir dist-release
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#appimages[@]}" -eq 1 && test "${#debs[@]}" -eq 1
          cp -- "${appimages[@]}" "${debs[@]}" dist-release/
          python3 scripts/check-linux-bundle.py dist-release/*.deb dist-release/*.AppImage | tee dist-release/linux-package-checks.txt
          (cd dist-release && sha256sum -- *.deb *.AppImage > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-x86_64-unknown-linux-gnu
          path: dist-release/
          if-no-files-found: error
          retention-days: 7
