# Auto-Merge: Schaltet GitHub-eingebauten Auto-Merge für PRs im Umfang ein.
# GitHub führt den PR selbst zusammen, sobald der Pflicht-Check "check" grün ist.
# Bewusst KEIN checkout des PR-Codes: Der Workflow fragt nur Metadaten über
# die GitHub-API ab (dependabot/fetch-metadata ebenfalls nur API) und ruft
# `gh pr merge --auto` auf.
# Umfang: eigene PRs und Dependabot-PRs (nur minor/patch, nie major/security).
name: Auto merge

on:
  pull_request:
    types: [labeled, opened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: >-
      github.event.pull_request.merged == false &&
      (
        github.event.pull_request.user.login == 'mixxermannipro' ||
        github.event.pull_request.user.login == 'dependabot[bot]'
      )
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Fetch Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Allow only own PRs and Dependabot minor/patch updates
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            update_type="${{ steps.metadata.outputs.update-type }}"
            if [ "$update_type" != "minor" ] && [ "$update_type" != "patch" ]; then
              echo "Nur Dependabot-Updates vom Typ minor/patch werden automatisch gemergt (vorhanden: $update_type)."
              exit 1
            fi
          fi
          echo "PR ist im Auto-Merge-Umfang."

      - name: Auto-Merge aktivieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          echo "Auto-Merge ist aktiv. GitHub führt den PR zusammen, sobald der Pflicht-Check 'check' grün ist."
