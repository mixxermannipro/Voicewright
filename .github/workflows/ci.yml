name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container: fedora:45
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora test dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install git tar gzip findutils util-linux-core \
            python3.11 python3.11-devel gcc kernel-headers portaudio xcb-util-cursor \
            libxkbcommon-x11 libglvnd-egl mesa-libGL xorg-x11-server-Xvfb xauth xclip \
            espeak-ng pulseaudio pulseaudio-utils alsa-plugins-pulseaudio
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check Python source
        run: |
          python3.11 -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt pytest
          python -m pip check
          python -m pytest -q
      - name: Check offline German and English speech recognition
        env:
          PYTHONPATH: src
        run: xvfb-run -a .venv/bin/python scripts/smoke-whisper.py "$RUNNER_TEMP/model"
      - name: Build and check Fedora installer
        run: |
          . .venv/bin/activate
          bash scripts/build-linux.sh
          runuser -u nobody -- xvfb-run -a bash scripts/smoke-linux.sh \
            release/Voicewright-*-linux-x86_64.tar.gz "$RUNNER_TEMP/model"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: voicewright-linux-x86_64
          path: release/
          if-no-files-found: error
