name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    uses: ./.github/workflows/linux-package.yml

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Check the interface
        run: |
          npm ci
          npm run check
          npm run lint
          npm test
          npm run build

      # Nicht blockierend: npm-Meldungen dürfen fremde PRs nicht stoppen.
      # Das wöchentliche Audit in audit.yml ist die Pflichtprüfung.
      - name: Audit npm dependencies (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libx11-dev libxdo-dev xvfb xdotool pkg-config \
            espeak-ng ffmpeg

      - name: Set up Rust checks
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            engines/cleanup/target
          key: ci-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}

      - name: Build the cleanup engine
        run: npm run prepare:engine -- x86_64-unknown-linux-gnu

      - name: Check formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path engines/cleanup/Cargo.toml --all -- --check

      - name: Check and test the native code
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
          cargo clippy --manifest-path engines/cleanup/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path engines/cleanup/Cargo.toml --locked --all-targets

      - name: Test model-gate failure paths and Linux package checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/voicewright-models/ggml-base.bin
            ${{ runner.temp }}/voicewright-models/Qwen3-0.6B-Q8_0.gguf
          key: verified-models-v1-${{ hashFiles('scripts/model-gate-models.json') }}

      # Real CPU inference, not mock-ASR. The script verifies even cached weights
      # and generates only synthetic speech; it never opens an audio/portal device.
      - name: Real Whisper and Qwen integration gate (synthetic DE/EN)
        run: |
          python3 scripts/model_gate.py \
            --cache "$RUNNER_TEMP/voicewright-models" \
            --output "$RUNNER_TEMP/model-evidence"

      - name: Preserve real-model evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: model-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/model-evidence/
          if-no-files-found: warn
          retention-days: 14

      # Run an actual isolated GTK text-field integration test through the
      # production X11 insertion module, not just unit-test mocks. The private
      # Xvfb display never touches a contributor's machine or needs consent.
      - name: Virtual X11 insertion integration test
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
        run: |
          timeout 300 bash scripts/linux-smoke/x11-insertion.sh

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Version und Prüfsumme fest eingezeichnet; die Datei kommt nur
      # aus dem offiziellen rhysd/actionlint-Release.
      - name: Install actionlint 1.7.12 (checksum-verified)
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check -
          tar xzf actionlint.tar.gz
          sudo mv actionlint /usr/local/bin/

      - name: Lint the workflow files
        run: actionlint

  # Pflicht-Check für den Branch-Schutz. Der Job läuft immer und schlägt
  # fehl, wenn nicht alle benötigten Jobs erfolgreich waren.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [web, rust, workflows, linux-package]
    if: always()
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = [
              f"{name}: {info.get('result')}"
              for name, info in needs.items()
              if info.get("result") != "success"
          ]
          if failed:
              sys.exit("Required jobs did not all succeed: " + ", ".join(failed))
          print("All required jobs succeeded.")
          PY
