name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng xvfb xauth libportaudio2 libxcb-cursor0 libxkbcommon-x11-0 libegl1
      - name: Check Python source
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -m pytest -q
      - name: Check offline German and English speech recognition
        env:
          PYTHONPATH: src
        run: xvfb-run -a python scripts/smoke-whisper.py
      - name: Build and check Linux package
        run: |
          bash scripts/build-linux.sh
          xvfb-run -a bash scripts/smoke-linux.sh release/Voicewright-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: voicewright-linux-x86_64
          path: release/
          if-no-files-found: error
