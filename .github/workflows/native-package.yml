name: Native test packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      RUST_TARGET: ${{ matrix.target }}
      BUNDLE: ${{ matrix.bundle }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (!(Test-Path (Join-Path $llvm 'libclang.dll'))) { throw 'Runner libclang.dll is missing' }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV

      - name: Prepare native toolchain
        run: |
          mkdir -p dist-native
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          actual=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual" = "$RUST_TARGET" || { echo "Expected native $RUST_TARGET, got $actual"; exit 1; }
          npm ci

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            engines/cleanup/target
          key: native-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '.github/workflows/native-package.yml') }}

      - name: Check and test both native Cargo projects
        run: |
          npm run prepare:engine -- "$RUST_TARGET" 2>&1 | tee dist-native/prepare.log
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path engines/cleanup/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee dist-native/app-clippy.log
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets 2>&1 | tee dist-native/app-tests.log
          cargo clippy --manifest-path engines/cleanup/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee dist-native/cleanup-clippy.log
          cargo test --manifest-path engines/cleanup/Cargo.toml --locked --all-targets 2>&1 | tee dist-native/cleanup-tests.log

      - name: Build and validate unpublished test installers
        run: |
          npm exec -- tauri build --ci --target "$RUST_TARGET" --bundles "$BUNDLE" -- --locked 2>&1 | tee dist-native/build.log
          node scripts/check-native-bundle.mjs --target "$RUST_TARGET" \
            --bundle-dir "src-tauri/target/$RUST_TARGET/release/bundle" --output dist-native

      - name: Always record the native job result
        if: always()
        env:
          NATIVE_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p dist-native
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          import { platform, arch, release } from 'node:os';
          writeFileSync('dist-native/job.json', JSON.stringify({
            commit: process.env.GITHUB_SHA, target: process.env.RUST_TARGET,
            runner: { os: platform(), arch: arch(), release: release() },
            status: process.env.NATIVE_JOB_STATUS,
            workflow_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            limitation: 'Native build/unit/package checks, not physical devices, permissions or editor E2E',
          }, null, 2) + '\n');
          JS

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: packages-${{ matrix.target }}
          path: dist-native/
          if-no-files-found: warn
          retention-days: 7
